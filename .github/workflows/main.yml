name: Complete MLOps Pipeline (Docker Hub & Hugging Face)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ----------------------------------------
    # PART 1: DOCKER HUB AUTOMATION (CI)
    # ----------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image to Hub
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        # Is se image aap ke Docker Hub repo mein chali jaye gi
        tags: ${{ secrets.DOCKER_USERNAME }}/my-ml-app:latest

    # ----------------------------------------
    # PART 2: HUGGING FACE AUTOMATION (CD)
    # ----------------------------------------
    - name: Install Hugging Face CLI
      run: pip install huggingface_hub [1]

    - name: Deploy Code to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Official CLI login aur code sync command bina kisi URL or slash error ke [1]
        huggingface-cli login --token $HF_TOKEN --add-to-git-credential [1]
        huggingface-cli upload_folder amnakhaalid1/my-ml-app . --repo-type=space --commit-message "Deploying professional dockerized ml app" [1]
