name: Professional MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ----------------------------------------
    # PART 1: DOCKER HUB AUTOMATION (CI)
    # ----------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image to Hub
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-ml-app:latest

    # ----------------------------------------
    # PART 2: HUGGING FACE DEPLOYMENT (GIT METHOD)
    # ----------------------------------------
    - name: Deploy to Hugging Face Space (Git method)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Clone the Space repo
        echo "Cloning Hugging Face Space..."
        git clone https://amnakhaalid1:$HF_TOKEN@huggingface.co/spaces/amnakhaalid1/my-ml-app
        
        # Copy all files (excluding .git and my-ml-app directory)
        echo "Copying files to Space..."
        cp -r ./* my-ml-app/ 2>/dev/null || true
        cp -r ./.[!.]* my-ml-app/ 2>/dev/null || true  # Copy hidden files
        
        # Commit and push changes
        cd my-ml-app
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        
        echo "Adding files to git..."
        git add .
        
        echo "Committing changes..."
        git commit -m "Production automated deployment from GitHub Actions - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        
        echo "Pushing to Hugging Face Space..."
        git push
        
        echo "✅ Deployment completed successfully!"
      shell: bash