name: Professional MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ----------------------------------------
    # PART 1: DOCKER HUB AUTOMATION (CI)
    # ----------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image to Hub
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-ml-app:latest

    # ----------------------------------------
    # PART 2: HUGGING FACE DEPLOYMENT - SIMPLE VERSION
    # ----------------------------------------
    - name: Deploy to Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Create a temporary directory for HF Space
        TEMP_DIR=$(mktemp -d)
        
        # Clone Space to temp directory
        git clone https://amnaakhalid1:$HF_TOKEN@huggingface.co/spaces/amnaakhalid1/my-ml-app $TEMP_DIR
        
        # Copy ALL files from current repo to temp dir (excluding .git)
        rsync -av --delete --exclude='.git' --exclude='hf_space' --exclude='temp_*' ./ $TEMP_DIR/
        
        # Push to Hugging Face
        cd $TEMP_DIR
        git config user.email "github-actions@github.com"
        git config user.name "GitHub Actions"
        git add .
        git commit -m "Auto-deploy: $(date)" || echo "No changes"
        git push origin main
        
        echo "✅ Deployed to Hugging Face Space!"
        
        # Cleanup
        cd /
        rm -rf $TEMP_DIR