name: Professional MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ----------------------------------------
    # PART 1: DOCKER HUB AUTOMATION (CI)
    # ----------------------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image to Hub
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/my-ml-app:latest

    # ----------------------------------------
    # PART 2: HUGGING FACE CLI NEW CD (AUTOMATION)
    # ----------------------------------------
    - name: Install New Hugging Face Hub CLI
      run: pip install --upgrade huggingface_hub

    - name: Deploy Code via HF Tool
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        # Naye tool ke mutabik token authenticate karna
        huggingface-cli login --token $HF_TOKEN
        
        # Folder ko direct upload karna (bina git credentials or remote slash issues k)
        huggingface-cli upload amnakhaalid1/my-ml-app . . --repo-type=space --commit-message "Production automated deployment from GitHub Actions"
